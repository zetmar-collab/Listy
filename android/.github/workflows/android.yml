name: Android build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Unit tests, lint and APK
        run: ./gradlew --no-daemon --max-workers 2 testDebugUnitTest lintDebug assembleDebug
      - name: Install emulator image
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-35;google_apis;x86_64"'
      - name: Instrumented tests on Android 15
        timeout-minutes: 12
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/listy-android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/listy-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n listy-ci -p "$ANDROID_AVD_HOME/listy-ci.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd listy-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader > /tmp/listy-emulator.log 2>&1 &
          emulator_pid=$!
          for i in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat /tmp/listy-emulator.log; exit 1; fi
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != '1' ]; then cat /tmp/listy-emulator.log; exit 1; fi
          ./gradlew --no-daemon --max-workers 2 connectedDebugAndroidTest
